<!doctype html>
<html lang="en">
  <head>
    <style>
      html[data-theme='light'] { background: #ffffff; color-scheme: light; }
      html[data-theme='dark'] { background: #101318; color-scheme: dark; }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="/studentxchange-logo.png" />
    <link rel="apple-touch-icon" href="/studentxchange-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1749d1" />
    <meta name="description" content="Buy, sell and find student services across Eswatini." />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('sx-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#101318' : '#1749d1');
        } catch {
          document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      })();
    </script>
    <title>StudentXchange — campus finds, made easy</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
